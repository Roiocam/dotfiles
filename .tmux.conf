# Project/session workflow managed by tmux.

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Core behavior
set -g default-terminal "tmux-256color"
set -g terminal-overrides ",xterm-kitty:RGB"
set -g escape-time 10
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 30000

# Keep colors enabled inside tmux panes. The agent runtime exports NO_COLOR=1,
# and tmux sessions created from that environment would otherwise inherit it.
set-environment -gu NO_COLOR
set-environment -g COLORTERM truecolor
set-environment -g CLICOLOR 1

# Mouse support: click status windows, focus panes, resize panes, scroll.
set -g mouse on

# Status bar: close to the old WezTerm palette.
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "fg=#20221f,bg=#fff7df"
set -g status-left-length 36
set -g status-right-length 48
set -g status-left "#[fg=#fff7df,bg=#1f5e37,bold] #S #[fg=#fff7df,bg=#fff7df,nobold] "
set -g status-right "#[fg=#20221f]%Y/%m/%d %H:%M:%S "
set -g window-status-separator ""
setw -g window-status-format "#{?#{||:#{@busy},#{||:#{||:#{||:#{m:⠋*,#{pane_title}},#{m:⠙*,#{pane_title}}},#{||:#{m:⠹*,#{pane_title}},#{m:⠸*,#{pane_title}}}},#{||:#{||:#{m:⠼*,#{pane_title}},#{m:⠴*,#{pane_title}}},#{||:#{||:#{m:⠦*,#{pane_title}},#{m:⠧*,#{pane_title}}},#{||:#{m:⠇*,#{pane_title}},#{m:⠏*,#{pane_title}}}}}}},#[fg=#050605]#[bg=#ffd166]#[nobold],#{?#{window_activity_flag},#[fg=#fff7df]#[bg=#050605]#[bold],#[fg=#20221f]#[bg=#eadfbd]#[nobold]}} #{?@busy,#($HOME/.local/bin/tmux-busy spinner),}#I:#{?#{==:#{window_panes},1},#{pane_current_command},#W[#{window_panes}]} #[fg=#fff7df]#[bg=#fff7df]#[nobold] "
setw -g window-status-current-format "#[fg=#fff7df,bg=#1f5e37,bold] #{?@busy,#($HOME/.local/bin/tmux-busy spinner),}#I:#{?#{==:#{window_panes},1},#{pane_current_command},#W[#{window_panes}]} #[fg=#fff7df,bg=#fff7df,nobold] "
setw -g window-status-style "fg=#20221f,bg=#eadfbd"
setw -g window-status-current-style "fg=#fff7df,bg=#1f5e37,bold"
setw -g monitor-activity on
setw -g window-status-activity-style "fg=#fff7df,bg=#050605,bold"
set -g message-style "fg=#050605,bg=#bdd8ac"
set -g mode-style "fg=#050605,bg=#bdd8ac"
set -g pane-border-style "fg=#c0c7b9"
set -g pane-active-border-style "fg=#1f5e37,bold"
set -g pane-border-status top
set -g pane-border-format " #P:#{pane_title} "
setw -g window-style "fg=#9fa89d,bg=default"
setw -g window-active-style "fg=#050605,bg=default"
set -g display-panes-active-colour "#1f5e37"
set -g display-panes-colour "#5f7f6e"

# Project/workspace picker.
bind f display-popup -E -w 80% -h 70% "$HOME/.local/bin/tmux-project"
bind C-f display-popup -E -w 80% -h 70% "$HOME/.local/bin/tmux-project"

# Windows: tmux windows are project-local tabs.
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9
bind w choose-tree -Zw
bind , command-prompt -I "#W" "rename-window '%%'"
bind & confirm-before -p "kill-window #W? (y/n)" kill-window

# Panes
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind z resize-pane -Z
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind o select-pane -t :.+
bind \; last-pane
bind '{' swap-pane -U
bind '}' swap-pane -D
bind Space next-layout
bind q display-panes

# Copy mode
setw -g mode-keys vi
bind [ copy-mode
bind ] paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi / command-prompt -p "search down" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "search up" "send -X search-backward '%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

# Misc
bind d detach-client
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind : command-prompt
