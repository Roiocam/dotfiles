# Migrated from ~/.config/wezterm on 2026-07-07.

# Core
auto_reload_config 0.1
scrollback_lines 3000
enable_audio_bell no
confirm_os_window_close -1

# Window
hide_window_decorations titlebar-only
window_padding_width 1
window_margin_width 0
macos_titlebar_color background

# Fonts
font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 14.0
symbol_map U+1F300-U+1FAFF Apple Color Emoji
symbol_map U+E000-U+F8FF Symbols Nerd Font Mono
symbol_map U+F0000-U+FFFFD Symbols Nerd Font Mono
symbol_map U+100000-U+10FFFD Symbols Nerd Font Mono

# Kitty tabs stay visible at the top. tmux windows stay visible at the bottom.
tab_bar_edge top
tab_bar_style separator
tab_bar_show_new_tab_button yes
tab_bar_min_tabs 2
tab_separator " "
tab_title_max_length 20
tab_title_template " {index}:{tab.last_focused_progress_percent}{title} "
active_tab_title_template " {fmt.bold}{index}:{tab.last_focused_progress_percent}{title}{fmt.nobold} "
tab_bar_background #fff7df
active_tab_foreground #1f5e37
active_tab_background #fff7df
inactive_tab_foreground #20221f
inactive_tab_background #fff7df
active_tab_font_style bold
inactive_tab_font_style normal

# Colors
foreground #050605
background #fff7df
cursor #5f7f6e
cursor_text_color #fff7df
cursor_shape block
selection_foreground #050605
selection_background #bdd8ac

color0  #050605
color1  #9b2424
color2  #1f7a3a
color3  #6e4b12
color4  #244f80
color5  #592f72
color6  #1f625e
color7  #343832
color8  #4c5149
color9  #bd3434
color10 #2a944a
color11 #835f1d
color12 #346494
color13 #6d4388
color14 #2f7772
color15 #050605

# macOS shortcuts translated to tmux prefix C-Space.
map cmd+1 send_text all \x00\x31
map cmd+2 send_text all \x00\x32
map cmd+3 send_text all \x00\x33
map cmd+4 send_text all \x00\x34
map cmd+5 send_text all \x00\x35
map cmd+6 send_text all \x00\x36
map cmd+7 send_text all \x00\x37
map cmd+8 send_text all \x00\x38
map cmd+9 send_text all \x00\x39
map cmd+left send_text all \x00p
map cmd+right send_text all \x00n
map cmd+t send_text all \x00\x63
map cmd+u open_url_with_hints

# tmux grabs normal mouse clicks when mouse mode is on. Shift-click stays
# handled by Kitty, so links can still be opened directly from tmux panes.
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
